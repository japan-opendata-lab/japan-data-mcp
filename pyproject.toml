[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "japan-data-mcp"
version = "1.0.0"
description = "Model Context Protocol (MCP) Server for Japanese Public Open Data Megabank (by Japan Open Data Lab)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Japan Open Data Lab", email = "japan.opendata.lab@gmail.com"}
]
keywords = ["mcp", "japan", "open-data", "government", "statistics", "procurement", "real-estate", "ai-agent", "duckdb"]
dependencies = []

[project.scripts]
japan-data-mcp = "server:run_stdio_server"
